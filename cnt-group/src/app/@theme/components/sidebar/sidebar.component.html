<aside class="sidebar" [class.show]="isSidebarVisible">
  <!-- Кнопка внутри сайдбара -->
  <button class="toggle-button" (click)="toggleSidebar()">
    <span>{{ isSidebarVisible ? '◀============' : '==▶' }}</span>
  </button>

  <div class="sidebar-header">
    <h2>Навигация</h2>
  </div>



  <div class="sidebar-divider"></div>

  <h3 class="dynamic-menu-title">Разделы</h3>

  <app-menu-childrens [sidebarHidden]="!isSidebarVisible" />

</aside>
